<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Célula animal e vegetal em 3D</title>
<!--
  Célula eucariótica, animal e vegetal, modelada no Blender.

  A geometria NÃO mora aqui: está em `celula-animal.glb` e `celula-vegetal.glb`,
  gerados por `ferramentas/modelos-3d/celula_blender.py` (a receita que monta
  a célula do zero dentro do Blender e exporta). Para mudar uma forma, muda-se
  a receita e exporta-se de novo — não se edita o .glb.

  Aqui ficam só o NOME e o TEXTO de cada estrutura, ligados ao arquivo pelo id
  que cada malha leva em `extras.parte`.

  É esquemática de propósito, como a figura do livro: tamanhos relativos
  exagerados para cada organela ser reconhecível.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.1/build/index.module.js"
  }
}
</script>
</head>
<body>
<script type="module">
import { criarVisualizador } from './_base.js'

criarVisualizador({
  // Chave dos textos editáveis na tabela `modelos3d_partes`. Os textos abaixo
  // são o "de fábrica": valem enquanto o admin não editar pelo ✎ do modelo.
  id: 'celula',
  titulo: 'Célula animal e vegetal em 3D',
  dica: 'Arraste para girar · clique numa estrutura',
  variantes: [
    { id: 'animal', nome: 'Animal' },
    { id: 'vegetal', nome: 'Vegetal' },
  ],
  arquivo: (variante) => `./celula-${variante}.glb`,
  // Ângulo inicial de cada uma: o corte em cunha atravessa o núcleo ao meio.
  vista: { animal: { x: 0.38, y: 0.35 }, vegetal: { x: 0.4, y: 0.9 } },
  // A ordem é a da lista "Estruturas" e a numeração do Teste-se: de fora para dentro.
  partes: [
    {
      id: 'parede', nome: 'Parede celular', curto: 'Parede', so: 'Só na vegetal',
      descricao: 'Camada rígida de celulose por fora da membrana. Dá forma e proteção e impede que a célula estoure ao absorver água. Na comparação animal × vegetal, só a vegetal tem.',
    },
    {
      id: 'plasmodesmos', nome: 'Plasmodesmos', so: 'Só na vegetal', miuda: true,
      descricao: 'Canais que atravessam a parede e ligam o citoplasma de células vizinhas, permitindo a troca de água, íons e moléculas entre elas.',
    },
    {
      id: 'membrana', nome: 'Membrana plasmática', curto: 'Membrana',
      descricao: 'Bicamada de fosfolipídios com proteínas que separa a célula do meio. É semipermeável: controla o que entra e o que sai.',
    },
    {
      id: 'citoplasma', nome: 'Citoplasma',
      descricao: 'Tudo o que fica entre a membrana e o núcleo: o citosol (líquido gelatinoso, rico em água e proteínas) e as organelas mergulhadas nele.',
    },
    {
      id: 'nucleo', nome: 'Núcleo (carioteca)', curto: 'Núcleo',
      descricao: 'Guarda o DNA e controla a atividade da célula. É envolto pela carioteca, uma membrana DUPLA com poros por onde passam RNA e proteínas — repare no corte: são duas camadas.',
    },
    {
      id: 'nucleolo', nome: 'Nucléolo',
      descricao: 'Região densa dentro do núcleo onde se produz o RNA ribossômico e se montam as subunidades dos ribossomos. Não tem membrana.',
    },
    {
      id: 'cromatina', nome: 'Cromatina',
      descricao: 'DNA associado a proteínas (histonas), desenrolado enquanto a célula não se divide. Na divisão celular, condensa-se e forma os cromossomos.',
    },
    {
      id: 'rer', nome: 'Retículo endoplasmático rugoso', curto: 'RE rugoso',
      descricao: 'Sacos achatados que continuam a membrana externa do núcleo, cobertos de ribossomos (por isso "rugoso"). Produz proteínas que vão para fora da célula, para a membrana ou para os lisossomos.',
    },
    {
      id: 'rel', nome: 'Retículo endoplasmático liso', curto: 'RE liso',
      descricao: 'Rede de túbulos sem ribossomos. Produz lipídios (como os hormônios esteroides) e ajuda a desintoxicar a célula — é abundante nas células do fígado.',
    },
    {
      id: 'golgi', nome: 'Complexo golgiense', curto: 'Golgi',
      descricao: 'Pilha de bolsas achatadas e curvas (cisternas). Modifica, empacota e endereça as proteínas que chegam do RE rugoso; das bordas brotam as vesículas de secreção e os lisossomos.',
    },
    {
      id: 'vacuolo', nome: 'Vacúolo central', curto: 'Vacúolo', so: 'Grande só na vegetal',
      descricao: 'Grande bolsa cheia de suco celular (água, sais, açúcares e pigmentos), envolta pelo tonoplasto. Ocupa a maior parte da célula madura, empurra o núcleo para a borda e mantém a pressão de turgor.',
    },
    {
      id: 'cloroplasto', nome: 'Cloroplasto', so: 'Só na vegetal',
      descricao: 'Faz a fotossíntese: usa luz, gás carbônico e água para produzir glicose e liberar gás oxigênio. Tem membrana dupla e DNA próprio; dentro, as pilhas de tilacoides (grana) ligadas pelas lamelas guardam a clorofila.',
    },
    {
      id: 'mitocondria', nome: 'Mitocôndria',
      descricao: 'Faz a respiração celular: quebra a glicose usando gás oxigênio e produz ATP, a energia que a célula usa. Tem membrana dupla — a interna é dobrada em cristas, visíveis nas que foram cortadas — e DNA próprio.',
    },
    {
      id: 'lisossomo', nome: 'Lisossomo', so: 'Típico da animal',
      descricao: 'Bolsa com enzimas digestivas. Faz a digestão intracelular: do que a célula englobou e das próprias organelas velhas (autofagia).',
    },
    {
      id: 'peroxissomo', nome: 'Peroxissomo',
      descricao: 'Vesícula com enzimas oxidativas, como a catalase, que decompõe a água oxigenada (H₂O₂) em água e gás oxigênio. O núcleo escuro é um cristal dessas enzimas.',
    },
    {
      id: 'centriolos', nome: 'Centríolos', so: 'Só na animal',
      descricao: 'Par de cilindros perpendiculares, cada um com 9 trios de microtúbulos. Organizam o fuso na divisão das células animais e originam cílios e flagelos.',
    },
    {
      id: 'citoesqueleto', nome: 'Citoesqueleto (microtúbulos)', curto: 'Citoesqueleto', miuda: true,
      descricao: 'Rede de filamentos de proteína que sustenta a forma da célula, ancora as organelas e serve de trilho para as vesículas. Na animal irradia dos centríolos; na vegetal corre em anéis sob a membrana, guiando a deposição de celulose.',
    },
    {
      id: 'vesiculas', nome: 'Vesículas',
      descricao: 'Pequenas bolsas de membrana que transportam substâncias entre as organelas e para fora da célula (secreção).',
    },
    {
      id: 'ribossomo', nome: 'Ribossomos', miuda: true,
      descricao: 'Fabricam proteínas lendo o RNA mensageiro. Não têm membrana; ficam livres no citosol ou presos ao RE rugoso. Vários lendo o mesmo RNA formam um polissomo — os "colares" de pontinhos.',
    },
  ],
})
</script>
</body>
</html>
